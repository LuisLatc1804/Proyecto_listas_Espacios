<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Espacios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">
        <h2>Planificador de Espacios</h2>

        <!-- Controles de Mes, Año e Impresión -->
        <div class="controles-mes">
            <button type="button" class="btn-mes" onclick="cambiarMes(-1)">◀ Anterior</button>
            <div class="selectores">
                <select id="selectMes" onchange="actualizarMes()"></select>
                <select id="selectAnio" onchange="actualizarMes()"></select>
            </div>
            <button type="button" class="btn-mes" onclick="cambiarMes(1)">Siguiente ▶</button>
            <button type="button" class="btn-imprimir" onclick="abrirModalImpresion()">🖨 Imprimir Reporte</button>
        </div>

        <!-- Vista de Calendario Principal -->
        <div class="grid-calendario" id="calendario"></div>
        <p class="nota">Selecciona cualquier día para gestionar o crear su lista de espacios.</p>
    </div>

    <!-- Modal / Ventana Emergente al hacer clic en un día -->
    <div id="modalDia" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3 id="modalTitulo">Asignaciones para el día</h3>
                <button type="button" class="btn-cerrar" onclick="cerrarModal()">&times;</button>
            </div>

            <!-- 1. Sección de registros ya guardados -->
            <h4 class="subtitulo-modal">Asignaciones existentes:</h4>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Compañero</th>
                            <th>Espacio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaExistentes"></tbody>
                </table>
            </div>

            <!-- 2. Formulario para agregar nuevas asignaciones -->
            <h4 class="subtitulo-modal">Agregar nueva asignación:</h4>
            <div class="formulario-item">
                <!-- Buscador con filtro dinámico -->
                <div class="campo">
                    <label for="inputBuscarCompanero">Compañero:</label>
                    <input type="text" id="inputBuscarCompanero" list="listaCompaneroDatalist"
                        placeholder="Escribe para buscar..." autocomplete="off">
                    <datalist id="listaCompaneroDatalist"></datalist>
                </div>

                <!-- Selector de Espacio -->
                <div class="campo">
                    <label for="modalEspacio">Espacio:</label>
                    <select id="modalEspacio">
                        <option value="Pollo">Pollo</option>
                        <option value="Desperdicio">Desperdicio</option>
                        <option value="Limpieza">Limpieza</option>
                        <option value="Fororo Y Chicha">Fororo Y Chicha</option>
                        <option value="Recepcion de Verduras">Recepcion de Verduras</option>
                    </select>
                </div>

                <button type="button" class="btn-agregar" onclick="agregarItemALista()">+ Agregar</button>
            </div>

            <!-- 3. Lista temporal pendiente por guardar -->
            <h4 class="subtitulo-modal">Nuevos por guardar en este lote:</h4>
            <div class="tabla-scroll">
                <table id="tablaItems">
                    <thead>
                        <tr>
                            <th>Compañero</th>
                            <th>Espacio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secundario" onclick="cerrarModal()">Cerrar</button>
                <button type="button" class="btn-primario" onclick="guardarListaDia()">Guardar Nuevos</button>
            </div>
        </div>
    </div>

    <!-- Modal de Impresión (sin la clase no-print que bloqueaba el diálogo) -->
    <div id="modalImprimir" class="modal oculto">
        <div class="modal-contenido modal-imprimir-box">
            <div class="modal-header">
                <h3>Imprimir Cronograma de Espacio</h3>
                <button type="button" class="btn-cerrar" onclick="cerrarModalImpresion()">&times;</button>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="selectEspacioImprimir">Selecciona el espacio a imprimir:</label>
                <select id="selectEspacioImprimir" onchange="actualizarVistaPreviaImpresion()">
                    <option value="Pollo">Pollo</option>
                    <option value="Limpieza">Limpieza</option>
                    <option value="Fororo Y Chicha">Fororo Y Chicha</option>
                    <option value="Recepcion de Verduras">Recepcion de Verduras</option>
                </select>
            </div>

            <!-- Contenedor del documento imprimible -->
            <div id="hojaImpresion" class="hoja-impresion">
                <!-- Se genera dinámicamente con JavaScript -->
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secundario" onclick="cerrarModalImpresion()">Cerrar</button>
                <button type="button" class="btn-primario" onclick="ejecutarImpresion()">Mandar a Imprimir /
                    PDF</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
